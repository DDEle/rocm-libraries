# Fused GEMM+reduce-scatter (FusedA2A: GemmRS) config for gfx1250, without and with a workgroup cluster.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumWarmups: 0
  SleepPercent: 0
  NumElementsToValidate: -1
  NumBenchmarks: 1
  EnqueuesPerSync: 3
  RotatingBufferSize: 1024
  ValidateAfterEnqueues: True
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  Device: 0
  PrintSolutionRejectionReason: True
  Architecture: gfx1250

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: False
      Batched: True
      FusedA2A: GemmRS
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]   # MT 256x256
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [4]
        - TDMInst: [3]
        - ExpandPointerSwap: [false]
        - 1LDSBuffer: [0]
        - GlobalSplitU: [1]
        - TileProcessingStrategy: ["None"]
        - WorkGroupMapping: [1]
        - WorkGroupMappingXCC: [1]
        - StaggerU: [0]
        - FusedRSWait: [0, 1, 2]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: {sizes: [3072, 512, 1, 2048], world: 2}
          - Exact: {sizes: [3072, 1024, 1, 2048], world: 2}
          - Exact: {sizes: [3072, 1024, 1, 2048], world: 4}
          - Exact: {sizes: [3072, 2048, 1, 2048], world: 4}
          - Exact: {sizes: [8192, 16384, 1, 2048], world: 4}
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]   # MT 256x256
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - DepthU: [128]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [4]
        - TDMInst: [3]
        - TDMIterateMode: [1]
        - HalfPLR: [2]
        - PrefetchGL2: [2]
        - LDSSegmentInterleave: [1]
        - LDSSegmentBRotate: [1]
        - VectorWidthA: [8]
        - SourceSwap: [True]
        - ExpandPointerSwap: [false]
        - 1LDSBuffer: [0]
        - GlobalSplitU: [1]
        - TileProcessingStrategy: ["None"]
        - WorkGroupMapping: [1]
        - WorkGroupMappingXCC: [1]
        - StaggerU: [0]
        - ClusterDim: [[2, 2], [4, 2], [2, 4]]
        - ClusterAIDMapping: [-1]
        - FusedRSWait: [0, 1, 2]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: {sizes: [3072, 1024, 1, 2048], world: 2}
          - Exact: {sizes: [3072, 2048, 1, 2048], world: 2}
          - Exact: {sizes: [3072, 4096, 1, 2048], world: 2}
          - Exact: {sizes: [3072, 2048, 1, 2048], world: 4}
          - Exact: {sizes: [3072, 4096, 1, 2048], world: 4}
          - Exact: {sizes: [8192, 16384, 1, 2048], world: 4}
