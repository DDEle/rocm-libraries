# fused_a2a_view.yaml with NumWarmups 1 and EnqueuesPerSync 22, run with --fused-a2a-verify.

TestParameters:
  marks: [skip, skip-gfx1250, skip-gfx1250-strict] # skip: only the inis are used, with --fused-a2a-verify

GlobalParameters:
  SyncsPerBenchmark: 1
  SleepPercent: 0
  NumElementsToValidate: -1
  NumBenchmarks: 1
  NumWarmups: 1
  EnqueuesPerSync: 22
  RotatingBufferSize: 1024
  ValidateAfterEnqueues: True
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  Device: 0
  PrintSolutionRejectionReason: True
  Architecture: gfx950
  ISA: [[9, 5, 0]]

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      FusedA2A: GemmA2A
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - MaxOccupancy: [40]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 8, 8,  2, 2]   # MT 256x256
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [0]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StaggerU: [0]
        - TileProcessingStrategy: ["None"]
        - WorkGroupMapping: [1]
        - MIArchVgpr: [False]
        - UseSubtileImpl: [True, False]
        - FusedA2ATransport: ["InKernel", "View"]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: {sizes: [3072, 512, 1, 2048], world: 2, a2aExtent: 2048}
          - Exact: {sizes: [3072, 511, 1, 2048], world: 2, a2aExtent: 2048}
          - Exact: {sizes: [3072, 512, 1, 2048], world: 4, a2aExtent: 2048}
          - Exact: {sizes: [3072, 511, 1, 2048], world: 4, a2aExtent: 2048}
          - Exact: {sizes: [3072, 512, 1, 2048], world: 8, a2aExtent: 2048}
          - Exact: {sizes: [3072, 511, 1, 2048], world: 8, a2aExtent: 2048}

LibraryLogic:
    ScheduleName: "gfx950"
    DeviceNames: ["Device 75a0"]
    ArchitectureName: "gfx950"
    LibraryType: "Equality"

LibraryClient:
